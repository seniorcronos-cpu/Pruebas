<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183c35">
<title>Salón — Ventas y stock</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--ink:#19332e;--muted:#71817c;--line:#e2e9e5;--bg:#f4f7f5;--green:#1e6b55;--pale:#e9f4ef;--red:#b84040;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:650}.app{max-width:1440px;margin:auto;min-height:100vh}.top{background:#183c35;color:white;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:750;letter-spacing:.2px}.brand small{display:block;color:#b9d2c9;font-size:12px;font-weight:400}.date{color:#cfe0d9;font-size:13px}.tabs{display:flex;gap:8px;background:white;border-bottom:1px solid var(--line);padding:12px 28px}.tab{background:transparent;color:#60716b}.tab.active{background:var(--pale);color:var(--green)}main{padding:24px 28px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px}.stat{padding:17px 19px}.stat label{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:25px;margin-top:5px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,.85fr);gap:16px;align-items:start}.panel{padding:18px}.panel h2{font-size:17px;margin:0 0 14px}.searchrow{display:flex;gap:9px;margin-bottom:13px}.field{width:100%;padding:10px 12px;border:1px solid #d9e3de;border-radius:9px;background:white;color:var(--ink);outline:none}.field:focus{border-color:#60a68d;box-shadow:0 0 0 3px #e1f1e9}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;max-height:60vh;overflow:auto}.product{border:1px solid var(--line);border-radius:11px;padding:12px;background:white;cursor:pointer;text-align:left;color:var(--ink)}.product:hover{border-color:#67a88e;background:#f7fbf8}.product:disabled{opacity:.45;cursor:not-allowed}.product b{display:block;margin-bottom:4px}.product span{display:block;color:var(--green);font-weight:700}.product small{color:var(--muted)}.cart-head{display:flex;justify-content:space-between;align-items:center}.cart-items{min-height:115px;max-height:34vh;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:10px 0;padding:4px 0}.empty{color:var(--muted);padding:30px 0;text-align:center}.cart-line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1ef}.cart-line:last-child{border:0}.cart-line small{display:block;color:var(--muted)}.qty{display:flex;align-items:center;gap:7px}.qty button{padding:3px 8px;background:#eff4f1;color:var(--ink)}.remove{padding:4px 7px;background:#fff0ef;color:var(--red)}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:750;padding:8px 0 12px}.primary{background:var(--green);color:white}.primary:hover{background:#17523f}.secondary{background:#edf3f0;color:var(--ink)}.danger{background:#fff0ef;color:var(--red)}.full{width:100%;padding:12px}.small{padding:7px 10px;font-size:13px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.toolbar .field{max-width:310px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:590px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf1ef}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f9fbfa}tr:last-child td{border:0}.low{color:var(--red);font-weight:700}.muted{color:var(--muted)}.empty-note{padding:25px;text-align:center;color:var(--muted)}.foot{padding:16px 28px;color:var(--muted);font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#183c35;color:white;padding:12px 16px;border-radius:10px;box-shadow:0 8px 30px #0002;display:none;z-index:5}.modalbg{position:fixed;inset:0;background:#10231fb0;display:none;align-items:center;justify-content:center;padding:16px;z-index:4}.modal{background:white;border-radius:14px;padding:22px;width:min(460px,100%);box-shadow:0 16px 50px #0003}.modal h2{margin:0 0 15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{font-size:13px;color:var(--muted)}.formgrid input{margin-top:5px}.formgrid .wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.sale-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.sale-row div small{display:block;color:var(--muted)}
.session{display:flex;align-items:center;gap:10px;color:#cfe0d9;font-size:13px}.session button{background:#e9f4ef;color:#183c35;padding:7px 11px;font-size:12px}.session button:disabled{opacity:.5;cursor:default}.searchrow .field{flex:1;min-width:0}.scan-input{display:flex;gap:6px;margin-top:5px}.scan-input .field{flex:1;margin:0;min-width:0}.scan-btn{flex:0 0 auto;background:var(--pale);color:var(--green);padding:8px 11px}.scanner-bg{position:fixed;inset:0;background:#10231fbd;display:none;align-items:center;justify-content:center;padding:16px;z-index:6}.scanner-box{background:#fff;border-radius:14px;padding:20px;width:min(500px,100%);box-shadow:0 16px 50px #0004}.scanner-box h2{margin:0 0 6px;font-size:18px}.scanner-box p{margin:6px 0 12px;color:var(--muted);font-size:13px}.scanner-box #barcode-reader{width:100%;min-height:220px;overflow:hidden;border-radius:9px}.scanner-actions{display:flex;justify-content:flex-end;margin-top:14px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.products{max-height:45vh}.stats{grid-template-columns:1fr}.top{padding:15px 18px}main{padding:18px}.tabs{padding:10px 18px;overflow:auto}.tab{white-space:nowrap}}
@page{size:80mm auto;margin:0}
@media print{html,body{width:80mm!important;height:auto!important;margin:0!important;padding:0!important;background:#fff!important}body{display:block!important}.app,.toast,.modalbg,.scanner-bg{display:none!important}#receipt{display:block!important;position:static!important;width:72mm!important;margin:0 auto!important;padding:3mm 4mm!important;box-sizing:content-box!important}.receipt{display:block;width:100%;margin:0;padding:0;font:11px/1.35 "Courier New",monospace;color:#000}.receipt h2{text-align:center;font-size:16px;margin:0 0 5px}.receipt .center{text-align:center}.receipt table{min-width:0;width:100%;font:inherit}.receipt td,.receipt th{padding:3px 0;border:0;vertical-align:top}.receipt .r{text-align:right;white-space:nowrap}.receipt hr{border:0;border-top:1px dashed #000;margin:6px 0}.receipt-total{display:flex;justify-content:space-between;font-weight:bold;font-size:14px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand">SALÓN <small>Ventas · stock · tickets</small></div><div class="session"><span id="today"></span><span id="currentSeller">Sin sesión</span><button id="loginButton" onclick="openLogin()">Iniciar sesión</button><button id="closeSessionButton" onclick="closeSession()" hidden>Cerrar sesión</button></div></header><nav class="tabs"><button class="tab active" data-view="sale">Nueva venta</button><button class="tab" data-view="stock">Productos y stock</button><button class="tab" data-view="suppliers">Proveedores</button><button class="tab" data-view="sellers">Vendedores</button><button class="tab" data-view="history">Ventas realizadas</button><button class="tab" data-view="shifts">Cierres de turno</button></nav><main id="main"></main><footer class="foot">Los datos se guardan en este navegador y en este equipo. Usá “Exportar respaldo” para conservar una copia.</footer></div><div id="receipt"></div><div class="toast" id="toast"></div><div class="modalbg" id="modalbg"><section class="modal" id="modal"></section></div><div class="scanner-bg" id="scannerModalBg"><section class="scanner-box"><h2>Escanear código</h2><p>Apuntá la cámara al código de barras o QR.</p><div id="barcode-reader"></div><p id="scannerStatus">Preparando cámara…</p><div class="scanner-actions"><button class="secondary" type="button" onclick="closeScanner()">Cancelar</button></div></section></div>
<script>
let activeBarcodeScanner=null,scanTargetInputId='',barcodeScanHandled=false;
async function stopBarcodeScanner(){let scanner=activeBarcodeScanner;activeBarcodeScanner=null;if(!scanner)return;try{if(scanner.isScanning)await scanner.stop()}catch{}try{scanner.clear()}catch{}}
function closeScanner(){document.getElementById('scannerModalBg').style.display='none';stopBarcodeScanner()}
async function onScanSuccess(decodedText){if(barcodeScanHandled)return;barcodeScanHandled=true;let targetId=scanTargetInputId;await stopBarcodeScanner();document.getElementById('scannerModalBg').style.display='none';let input=document.getElementById(targetId);if(!input)return;input.value=decodedText;input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));if(targetId==='productCodeInput')input.reportValidity()}
async function startBarcodeScanner(targetId){if(typeof Html5Qrcode==='undefined'){toast('No se pudo cargar html5-qrcode. Revisá la conexión a Internet.');return}await stopBarcodeScanner();scanTargetInputId=targetId;barcodeScanHandled=false;document.getElementById('scannerModalBg').style.display='flex';document.getElementById('scannerStatus').textContent='Solicitando permiso para usar la cámara…';let scanner=new Html5Qrcode('barcode-reader',{verbose:false});activeBarcodeScanner=scanner;let config={fps:10,qrbox:(width,height)=>({width:Math.min(Math.floor(width*.9),360),height:Math.min(Math.floor(height*.48),140)}),aspectRatio:1.777,formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.CODABAR]};let success=(text,result)=>onScanSuccess(text,result),failure=()=>{};try{await scanner.start({facingMode:'environment'},config,success,failure);if(activeBarcodeScanner===scanner)document.getElementById('scannerStatus').textContent='Cámara activa. Alineá el código dentro del recuadro.'}catch(firstError){if(activeBarcodeScanner!==scanner)return;try{document.getElementById('scannerStatus').textContent='Buscando una cámara disponible…';let cameras=await Html5Qrcode.getCameras();if(!cameras.length)throw firstError;let camera=cameras.find(c=>/back|rear|environment|trasera|posterior/i.test(c.label))||cameras[0];await scanner.start(camera.id,config,success,failure);if(activeBarcodeScanner===scanner)document.getElementById('scannerStatus').textContent=`Cámara activa: ${camera.label||'webcam'}. Alineá el código dentro del recuadro.`}catch(error){if(activeBarcodeScanner===scanner)document.getElementById('scannerStatus').textContent='No se pudo abrir la cámara. Permití el acceso y probá desde HTTPS o localhost.'}}}
const KEY='salon_ventas_v1';let db=load(),cart=[],view='sale',search='',currentSellerId='',currentShiftId='';db.suppliers??=[];db.sellers??=[];db.shifts??=[];db.products.forEach(p=>p.supplierId??='');function load(){try{return JSON.parse(localStorage.getItem(KEY))||{products:[],sales:[],next:1,suppliers:[],sellers:[],shifts:[]}}catch{return{products:[],sales:[],next:1,suppliers:[],sellers:[],shifts:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(Number(n)||0);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function today(){return new Intl.DateTimeFormat('es-AR',{dateStyle:'full'}).format(new Date())}document.getElementById('today').textContent=today();function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}function setView(v){view=v;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function updateSession(){let s=db.sellers.find(x=>x.id===currentSellerId);document.getElementById('currentSeller').textContent=s?'Vendedor: '+s.name:'Sin sesión';document.getElementById('loginButton').hidden=!!s;document.getElementById('closeSessionButton').hidden=!s}function render(){updateSession();if(view==='sale')saleView();if(view==='stock')stockView();if(view==='suppliers')suppliersView();if(view==='sellers')sellersView();if(view==='history')historyView();if(view==='shifts')shiftsView()}
function saleView(){let q=search.toLowerCase();let products=db.products.filter(p=>p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q));let total=cart.reduce((a,x)=>a+x.price*x.qty,0);document.getElementById('main').innerHTML=`<section class="stats"><div class="stat"><label>Productos cargados</label><strong>${db.products.length}</strong></div><div class="stat"><label>Unidades en stock</label><strong>${db.products.reduce((a,p)=>a+p.stock,0)}</strong></div><div class="stat"><label>Ventas de hoy</label><strong>${money(db.sales.filter(s=>new Date(s.date).toDateString()===new Date().toDateString()).reduce((a,s)=>a+s.total,0))}</strong></div></section><div class="layout"><section class="panel"><h2>Elegí productos</h2><div class="searchrow"><input class="field" id="search" placeholder="Buscar por nombre o código…" value="${esc(search)}"><button class="scan-btn" type="button" title="Escanear con cámara" aria-label="Escanear código con cámara" onclick="startBarcodeScanner('search')">📷</button></div><div class="products">${products.length?products.map(p=>`<button class="product" ${p.stock<=0?'disabled':''} onclick="addToCart('${p.id}')"><b>${esc(p.name)}</b><span>${money(p.price)}</span><small>${p.stock} en stock${p.code?' · '+esc(p.code):''}</small></button>`).join(''):'<div class="empty-note">No hay productos. Cargalos en “Productos y stock”.</div>'}</div></section><section class="panel"><div class="cart-head"><h2>Ticket actual</h2><button class="small secondary" onclick="clearCart()">Vaciar</button></div><div class="cart-items">${cart.length?cart.map(x=>`<div class="cart-line"><div>${esc(x.name)}<small>${money(x.price)} c/u</small></div><div class="qty"><button onclick="changeQty('${x.id}',-1)">−</button><b>${x.qty}</b><button onclick="changeQty('${x.id}',1)">+</button></div><button class="remove" onclick="removeItem('${x.id}')">×</button></div>`).join(''):'<div class="empty">Agregá productos para comenzar</div>'}</div><div class="total"><span>Total</span><span>${money(total)}</span></div><button class="primary full" ${cart.length&&currentSellerId?'':'disabled'} onclick="finishSale()">Cobrar e imprimir ticket</button><p class="muted" style="font-size:12px;margin-bottom:0">${currentSellerId?'Al cobrar, el stock se descuenta automáticamente.':'Iniciá sesión como vendedor para cobrar.'}</p></section></div>`;document.getElementById('search').oninput=e=>{search=e.target.value;saleView();let el=document.getElementById('search');el.focus();el.setSelectionRange(search.length,search.length)}}
function addToCart(id){let p=db.products.find(x=>x.id===id),x=cart.find(x=>x.id===id);if(!p||p.stock<1)return toast('No hay stock disponible');if(x){if(x.qty>=p.stock)return toast('La cantidad supera el stock');x.qty++}else cart.push({id:p.id,name:p.name,price:p.price,qty:1});saleView()}function changeQty(id,d){let x=cart.find(x=>x.id===id),p=db.products.find(p=>p.id===id);if(!x)return;if(x.qty+d<1)return removeItem(id);if(d>0&&x.qty>=p.stock)return toast('La cantidad supera el stock');x.qty+=d;saleView()}function removeItem(id){cart=cart.filter(x=>x.id!==id);saleView()}function clearCart(){cart=[];saleView()}function finishSale(){if(!currentSellerId||!currentShiftId)return toast('Iniciá sesión como vendedor antes de cobrar');if(!cart.length)return;for(const x of cart){let p=db.products.find(p=>p.id===x.id);if(!p||p.stock<x.qty)return toast('Stock insuficiente para '+x.name)}let seller=db.sellers.find(s=>s.id===currentSellerId);if(!seller)return toast('Volvé a iniciar sesión');let sale={number:db.next++,date:new Date().toISOString(),sellerId:seller.id,sellerName:seller.name,shiftId:currentShiftId,items:cart.map(x=>({...x})),total:cart.reduce((a,x)=>a+x.price*x.qty,0)};sale.items.forEach(x=>db.products.find(p=>p.id===x.id).stock-=x.qty);db.sales.unshift(sale);save();cart=[];render();showReceipt(sale);window.print()}
function showReceipt(s){document.getElementById('receipt').innerHTML=`<article class="receipt"><h2>SALÓN</h2><div class="center">Ticket de venta</div><hr><div>Ticket: ${s.number}</div><div>${new Date(s.date).toLocaleString('es-AR')}</div><div>Vendedor: ${esc(s.sellerName||'Sin dato')}</div><hr><table>${s.items.map(x=>`<tr><td>${esc(x.name)}<br>${x.qty} × ${money(x.price)}</td><td class="r">${money(x.qty*x.price)}</td></tr>`).join('')}</table><hr><div class="receipt-total"><span>TOTAL</span><span>${money(s.total)}</span></div><hr><div class="center">¡Gracias por tu compra!</div></article>`}
function stockView(){document.getElementById('main').innerHTML=`<div class="toolbar"><input class="field" id="stockSearch" placeholder="Buscar producto…" value="${esc(search)}"><button class="primary" onclick="openProduct()">＋ Agregar producto</button><button class="secondary" onclick="backup()">Exportar respaldo</button><button class="secondary" onclick="document.getElementById('importFile').click()">Importar respaldo</button><input type="file" id="importFile" accept="application/json" hidden></div><div class="tablewrap"><table><thead><tr><th>Producto</th><th>Código</th><th>Proveedor</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody id="stockRows"></tbody></table></div>`;let file=document.getElementById('importFile');file.onchange=e=>importBackup(e.target.files[0]);document.getElementById('stockSearch').oninput=e=>{search=e.target.value;fillStock()};fillStock()}
function fillStock(){let rows=db.products.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||p.code.toLowerCase().includes(search.toLowerCase())||(db.suppliers.find(s=>s.id===p.supplierId)?.name||'').toLowerCase().includes(search.toLowerCase()));document.getElementById('stockRows').innerHTML=rows.length?rows.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.code)||'—'}</td><td>${esc(db.suppliers.find(s=>s.id===p.supplierId)?.name||'—')}</td><td>${money(p.price)}</td><td class="${p.stock<=3?'low':''}">${p.stock}</td><td><button class="small secondary" onclick="openProduct('${p.id}')">Editar</button> <button class="small danger" onclick="deleteProduct('${p.id}')">Eliminar</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty-note">Todavía no hay productos cargados.</td></tr>'}
function validateProductCode(input,id){let code=input.value.trim(),duplicate=!!code&&db.products.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!==id);input.setCustomValidity(duplicate?'Ese código ya está usado':'');return !duplicate}
function openProduct(id){let p=id?db.products.find(x=>x.id===id):null;document.getElementById('modal').innerHTML=`<h2>${p?'Editar producto':'Nuevo producto'}</h2><form id="productForm"><div class="formgrid"><label class="wide">Nombre<input class="field" name="name" required maxlength="80" value="${esc(p?.name||'')}"></label><label>Código<div class="scan-input"><input class="field" id="productCodeInput" name="code" maxlength="40" value="${esc(p?.code||'')}"><button class="scan-btn" type="button" title="Escanear código con cámara" aria-label="Escanear código con cámara" onclick="startBarcodeScanner('productCodeInput')">📷</button></div></label><label>Precio ($)<input class="field" name="price" type="number" min="0" step="0.01" required value="${p?.price??''}"></label><label>Stock actual<input class="field" name="stock" type="number" min="0" step="1" required value="${p?.stock??0}"></label><label class="wide">Proveedor<select class="field" name="supplierId"><option value="">Sin proveedor asignado</option>${db.suppliers.map(s=>`<option value="${s.id}" ${p?.supplierId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Guardar</button></div></form>`;document.getElementById('modalbg').style.display='flex';let codeInput=document.getElementById('productCodeInput');codeInput.addEventListener('input',()=>validateProductCode(codeInput,id));document.getElementById('productForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),code=f.get('code').trim(),price=Number(f.get('price')),stock=Number(f.get('stock')),supplierId=f.get('supplierId');if(!name||price<0||stock<0)return;if(!validateProductCode(codeInput,id)){codeInput.reportValidity();return}if(p)Object.assign(p,{name,code,price,stock,supplierId});else db.products.push({id:crypto.randomUUID(),name,code,price,stock,supplierId});save();closeModal();render();toast('Producto guardado')}}
function closeModal(){document.getElementById('modalbg').style.display='none'}function deleteProduct(id){let p=db.products.find(x=>x.id===id);if(!p)return;if(confirm(`¿Eliminar “${p.name}”?`)){db.products=db.products.filter(x=>x.id!==id);cart=cart.filter(x=>x.id!==id);save();render();toast('Producto eliminado')}}
function suppliersView(){document.getElementById('main').innerHTML=`<div class="toolbar"><h2 style="margin:0">Proveedores</h2><button class="primary" onclick="openSupplier()">＋ Agregar proveedor</button></div><div class="tablewrap"><table><thead><tr><th>Proveedor</th><th>Contacto</th><th>Teléfono</th><th>Email</th><th>Productos</th><th>Acciones</th></tr></thead><tbody>${db.suppliers.length?db.suppliers.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.contact)||'—'}</td><td>${esc(s.phone)||'—'}</td><td>${esc(s.email)||'—'}</td><td>${db.products.filter(p=>p.supplierId===s.id).length}</td><td><button class="small secondary" onclick="openSupplier('${s.id}')">Editar</button> <button class="small danger" onclick="deleteSupplier('${s.id}')">Eliminar</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty-note">Todavía no hay proveedores cargados.</td></tr>'}</tbody></table></div>`}
function openSupplier(id){let s=id?db.suppliers.find(x=>x.id===id):null;document.getElementById('modal').innerHTML=`<h2>${s?'Editar proveedor':'Nuevo proveedor'}</h2><form id="supplierForm"><div class="formgrid"><label class="wide">Nombre o razón social<input class="field" name="name" required maxlength="100" value="${esc(s?.name||'')}"></label><label>Persona de contacto<input class="field" name="contact" maxlength="80" value="${esc(s?.contact||'')}"></label><label>Teléfono<input class="field" name="phone" maxlength="40" value="${esc(s?.phone||'')}"></label><label class="wide">Email<input class="field" name="email" type="email" maxlength="120" value="${esc(s?.email||'')}"></label><label class="wide">Notas<input class="field" name="notes" maxlength="250" value="${esc(s?.notes||'')}"></label></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Guardar</button></div></form>`;document.getElementById('modalbg').style.display='flex';document.getElementById('supplierForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),data={name:f.get('name').trim(),contact:f.get('contact').trim(),phone:f.get('phone').trim(),email:f.get('email').trim(),notes:f.get('notes').trim()};if(!data.name)return;if(s)Object.assign(s,data);else db.suppliers.push({id:crypto.randomUUID(),...data});save();closeModal();render();toast('Proveedor guardado')}}
function deleteSupplier(id){let s=db.suppliers.find(x=>x.id===id);if(!s)return;let linked=db.products.filter(p=>p.supplierId===id).length;if(confirm(`¿Eliminar “${s.name}”?${linked?` ${linked} producto(s) quedarán sin proveedor asignado.`:''}`)){db.suppliers=db.suppliers.filter(x=>x.id!==id);db.products.forEach(p=>{if(p.supplierId===id)p.supplierId=''});save();render();toast('Proveedor eliminado')}}
function sellersView(){document.getElementById('main').innerHTML=`<div class="toolbar"><h2 style="margin:0">Vendedores</h2><button class="primary" onclick="openSeller()">＋ Agregar vendedor</button></div><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>PIN de acceso</th><th>Ventas registradas</th><th>Acciones</th></tr></thead><tbody>${db.sellers.length?db.sellers.map(s=>`<tr><td><b>${esc(s.name)}</b>${s.id===currentSellerId?' · sesión actual':''}</td><td>••••</td><td>${db.sales.filter(v=>v.sellerId===s.id).length}</td><td><button class="small secondary" onclick="openSeller('${s.id}')">Editar</button> <button class="small danger" onclick="deleteSeller('${s.id}')">Eliminar</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty-note">Agregá vendedores y asignales un PIN para iniciar sesión.</td></tr>'}</tbody></table></div><p class="muted" style="font-size:13px">Los PIN se guardan localmente en este navegador. Son para identificar turnos, no para proteger información confidencial.</p>`}
function openSeller(id){let s=id?db.sellers.find(x=>x.id===id):null;document.getElementById('modal').innerHTML=`<h2>${s?'Editar vendedor':'Nuevo vendedor'}</h2><form id="sellerForm"><div class="formgrid"><label class="wide">Nombre que aparecerá en los tickets<input class="field" name="name" required maxlength="80" value="${esc(s?.name||'')}"></label><label class="wide">PIN de acceso (4 a 8 dígitos)<input class="field" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" ${s?'placeholder="Dejar vacío para conservar el PIN"':''} ${s?'':'required'}></label></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Guardar</button></div></form>`;document.getElementById('modalbg').style.display='flex';document.getElementById('sellerForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),pin=f.get('pin');if(!name)return;if(pin&&!/^\d{4,8}$/.test(pin))return toast('El PIN debe tener de 4 a 8 dígitos');if(db.sellers.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==id))return toast('Ya existe un vendedor con ese nombre');if(s){s.name=name;if(pin)s.pin=pin}else db.sellers.push({id:crypto.randomUUID(),name,pin});save();closeModal();render();toast('Vendedor guardado')}}
function openLogin(){if(!db.sellers.length){toast('Primero agregá vendedores en la sección Vendedores');setView('sellers');return}document.getElementById('modal').innerHTML=`<h2>Iniciar sesión</h2><form id="loginForm"><div class="formgrid"><label class="wide">Vendedor<select class="field" name="sellerId" required><option value="">Elegí tu nombre…</option>${db.sellers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label class="wide">PIN<input class="field" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required autofocus></label></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Ingresar</button></div></form>`;document.getElementById('modalbg').style.display='flex';document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),s=db.sellers.find(x=>x.id===f.get('sellerId'));if(!s||s.pin!==f.get('pin'))return toast('Nombre o PIN incorrecto');let openShift=db.shifts.filter(x=>x.sellerId===s.id&&!x.closedAt).sort((a,b)=>new Date(b.openedAt)-new Date(a.openedAt))[0];currentSellerId=s.id;if(openShift)currentShiftId=openShift.id;else{let shift={id:crypto.randomUUID(),sellerId:s.id,sellerName:s.name,openedAt:new Date().toISOString(),closedAt:null};db.shifts.unshift(shift);currentShiftId=shift.id;save()}closeModal();render();toast(openShift?'Turno abierto recuperado':'Turno iniciado: '+s.name)}}
function closeSession(){if(!currentShiftId||!currentSellerId)return;if(cart.length&&!confirm('Hay productos en el ticket actual. Si cerrás sesión, ese ticket se vaciará. ¿Continuar?'))return;let shift=db.shifts.find(x=>x.id===currentShiftId);if(!shift)return toast('No se encontró el turno abierto');let sales=db.sales.filter(s=>s.shiftId===shift.id);shift.closedAt=new Date().toISOString();shift.salesCount=sales.length;shift.total=sales.reduce((a,s)=>a+s.total,0);currentSellerId='';currentShiftId='';cart=[];save();setView('shifts');toast(`Turno cerrado · ${shift.salesCount} ventas · ${money(shift.total)}`)}
function deleteSeller(id){let s=db.sellers.find(x=>x.id===id);if(!s)return;let n=db.sales.filter(v=>v.sellerId===id).length;if(confirm(`¿Eliminar a ${s.name}? Las ventas históricas conservarán su nombre.${n?' Ya tiene '+n+' venta(s) registradas.':''}`)){db.sellers=db.sellers.filter(x=>x.id!==id);if(currentSellerId===id)currentSellerId='';save();render();toast('Vendedor eliminado')}}
function historyView(){document.getElementById('main').innerHTML=`<div class="toolbar"><h2 style="margin:0">Ventas realizadas</h2><button class="secondary" onclick="exportSales()">Exportar ventas CSV</button></div><div class="tablewrap"><table><thead><tr><th>Ticket</th><th>Fecha y hora</th><th>Vendedor</th><th>Artículos</th><th>Total</th><th>Acción</th></tr></thead><tbody>${db.sales.length?db.sales.map(s=>`<tr><td>#${s.number}</td><td>${new Date(s.date).toLocaleString('es-AR')}</td><td>${esc(s.sellerName||'Sin dato')}</td><td>${s.items.reduce((a,x)=>a+x.qty,0)} unidades</td><td><b>${money(s.total)}</b></td><td><button class="small secondary" onclick="reprint(${s.number})">Reimprimir</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty-note">Todavía no hay ventas.</td></tr>'}</tbody></table></div>`}function reprint(n){let s=db.sales.find(x=>x.number===n);showReceipt(s);window.print()}
function shiftsView(){let shifts=db.shifts||[];document.getElementById('main').innerHTML=`<div class="toolbar"><h2 style="margin:0">Cierres de turno</h2><span class="muted">Cada cierre guarda las ventas entre la apertura y el cierre del vendedor.</span></div><div class="tablewrap"><table><thead><tr><th>Vendedor</th><th>Apertura</th><th>Cierre</th><th>Ventas</th><th>Total del turno</th><th>Estado</th><th></th></tr></thead><tbody>${shifts.length?shifts.map(s=>{let sales=db.sales.filter(v=>v.shiftId===s.id),total=s.closedAt?(s.total??sales.reduce((a,v)=>a+v.total,0)):sales.reduce((a,v)=>a+v.total,0);return `<tr><td><b>${esc(s.sellerName)}</b></td><td>${new Date(s.openedAt).toLocaleString('es-AR')}</td><td>${s.closedAt?new Date(s.closedAt).toLocaleString('es-AR'):'—'}</td><td>${s.closedAt?(s.salesCount??sales.length):sales.length}</td><td><b>${money(total)}</b></td><td>${s.closedAt?'Cerrado':'Abierto'}</td><td>${s.closedAt?`<button class="small secondary" onclick="printShift('${s.id}')">Imprimir cierre</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty-note">Todavía no hay turnos registrados.</td></tr>'}</tbody></table></div>`}
function printShift(id){let s=db.shifts.find(x=>x.id===id);if(!s||!s.closedAt)return;document.getElementById('receipt').innerHTML=`<article class="receipt"><h2>SALÓN</h2><div class="center">Cierre de turno</div><hr><div>Vendedor: ${esc(s.sellerName)}</div><div>Apertura: ${new Date(s.openedAt).toLocaleString('es-AR')}</div><div>Cierre: ${new Date(s.closedAt).toLocaleString('es-AR')}</div><div>Ventas: ${s.salesCount||0}</div><hr><div class="receipt-total"><span>TOTAL VENDIDO</span><span>${money(s.total||0)}</span></div></article>`;window.print()}
function backup(){download('respaldo-salon-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')}function importBackup(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.products)||!Array.isArray(data.sales)||!Number.isInteger(data.next))throw Error();if(confirm('La importación reemplazará los productos y ventas actuales. ¿Continuar?')){data.suppliers??=[];data.sellers??=[];data.shifts??=[];data.products.forEach(p=>p.supplierId??='');db=data;currentSellerId='';currentShiftId='';save();render();toast('Respaldo importado')}}catch{toast('El archivo no tiene un respaldo válido')} };reader.readAsText(file)}function exportSales(){let rows=[['Ticket','Fecha','Vendedor','Producto','Cantidad','Precio unitario','Subtotal','Total']];db.sales.forEach(s=>s.items.forEach(x=>rows.push([s.number,new Date(s.date).toLocaleString('es-AR'),s.sellerName||'Sin dato',x.name,x.qty,x.price,x.qty*x.price,s.total])));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');download('ventas-salon.csv',csv,'text/csv;charset=utf-8')}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};render();if(db.sellers.length)openLogin();
</script></body></html>
